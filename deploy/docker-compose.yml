# USFDS deployment stack (Web - Server - Worker - Infra).
#   All services:     docker compose --env-file .env up -d --build
#   Infra only:       docker compose --env-file .env up -d postgres rustfs
# Run from the `deploy/` directory. Copy `.env.example` to `.env` first.

name: usfds

x-app-env: &app-env
  USFDS_DB_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
  USFDS_DB_ECHO: "false"
  USFDS_STORAGE_BACKEND: s3
  USFDS_S3_ENDPOINT_URL: http://rustfs:9000
  USFDS_S3_PUBLIC_ENDPOINT_URL: ${USFDS_S3_PUBLIC_ENDPOINT_URL:-http://localhost:${RUSTFS_API_PORT:-9000}}
  USFDS_S3_BUCKET: ${USFDS_S3_BUCKET}
  USFDS_S3_ACCESS_KEY: ${RUSTFS_ACCESS_KEY}
  USFDS_S3_SECRET_KEY: ${RUSTFS_SECRET_KEY}
  USFDS_S3_REGION: ${USFDS_S3_REGION}
  USFDS_DISPATCH_BACKEND: queue

services:
  postgres:
    # PostgreSQL 17 + Apache AGE 1.7.0 (OLTP + Graph + BullMQ job queue in one instance)
    image: apache/age:release_PG17_1.7.0
    container_name: usfds-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  rustfs:
    # S3-compatible object storage
    image: rustfs/rustfs:1.0.4-glibc
    container_name: usfds-rustfs
    restart: unless-stopped
    environment:
      RUSTFS_VOLUMES: /data
      RUSTFS_ADDRESS: ":9000"
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_CONSOLE_ADDRESS: ":9001"
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY}
    ports:
      - "${RUSTFS_API_PORT:-9000}:9000"
      - "${RUSTFS_CONSOLE_PORT:-9001}:9001"
    volumes:
      - rustfs_data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9000/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5

  usfds-server:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.server
    container_name: usfds-server
    restart: unless-stopped
    environment:
      <<: *app-env
      USFDS_HOST: 0.0.0.0
      USFDS_PORT: "8000"
    ports:
      - "${USFDS_SERVER_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      rustfs:
        condition: service_healthy

  usfds-worker:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.worker
    container_name: usfds-worker
    restart: unless-stopped
    environment:
      <<: *app-env
      USFDS_WORKER_CONCURRENCY: ${USFDS_WORKER_CONCURRENCY:-1}
    depends_on:
      postgres:
        condition: service_healthy
      rustfs:
        condition: service_healthy

  usfds-web:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.web
    container_name: usfds-web
    restart: unless-stopped
    ports:
      - "${USFDS_WEB_PORT:-5173}:80"
    depends_on:
      - usfds-server

volumes:
  postgres_data:
  rustfs_data:
