[project]
name = "usfds-core"
version = "0.1.0"
description = "Core domain logic and preprocessing framework for USFDS"
authors = [
    {name = "pqkkkk", email = "22120174@student.hcmus.edu.vn"}
]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.6.0",
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    "scikit-learn>=1.4.0,<1.6.0",
    "imbalanced-learn>=0.12.0",
    "category-encoders>=2.6.0",
    "pyarrow>=15.0.0",
    "joblib>=1.3.0",
    "xgboost (>=3.4.1,<4.0.0)",
    "duckdb>=0.10.0",
    "shap>=0.44.0",
]

[tool.poetry]
packages = [{include = "usfds_core", from = "src"}]

[tool.poetry.dependencies]
python = ">=3.12"
pydantic = "^2.6.0"
pandas = "^2.2.0"
numpy = "^1.26.0"
scikit-learn = ">=1.4.0, <1.6.0"
imbalanced-learn = "^0.12.0"
category-encoders = "^2.6.0"
pyarrow = "^15.0.0"
joblib = "^1.3.0"
duckdb = ">=0.10.0"
shap = ">=0.44.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0.0"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
