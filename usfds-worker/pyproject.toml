[project]
name = "usfds-worker"
version = "0.1.0"
description = "Background compute worker (model training, batch inference) for USFDS"
authors = [
    {name = "pqkkkk", email = "22120174@student.hcmus.edu.vn"}
]
readme = "README.md"
requires-python = ">=3.12"

[tool.poetry]
packages = [{include = "usfds_worker", from = "src"}]

[tool.poetry.scripts]
usfds-worker = "usfds_worker.main:run_worker"

[tool.poetry.dependencies]
python = ">=3.12"
usfds-core = {path = "../usfds-core", develop = true}
usfds-infra = {path = "../usfds-infra", develop = true}

[tool.poetry.group.dev.dependencies]
pytest = "^8.0.0"
moto = {version = "^5.0", extras = ["s3"]}

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
